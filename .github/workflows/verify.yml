name: Verify application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reviewer_test
          POSTGRES_PASSWORD: reviewer_ci_database_only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U reviewer_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_USERNAME: reviewer_test
      TEST_DATABASE_PASSWORD: reviewer_ci_database_only
      RUN_GITHUB_SMOKE: 'false'
      RUN_GITLAB_SMOKE: 'false'
      RUN_OLLAMA_SMOKE: 'false'
      RUN_AI_EVALUATION: 'false'
      RUN_GIT_LOAD_SMOKE: 'false'
      RUN_REVIEW_LOAD_SMOKE: 'false'
      RUN_OPERATIONS_LOAD_SMOKE: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files for secrets
        run: python3 scripts/check-secrets.py --tracked
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            source/pom.xml
            source/.mvn/wrapper/maven-wrapper.properties
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Create isolated integration databases
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_SERVICE_ID" createdb -U reviewer_test reviewer_integration
          docker exec "$POSTGRES_SERVICE_ID" createdb -U reviewer_test identity_security
      - name: Verify security and report gate fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build and run all local integration tests
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/reviewer_integration
          TEST_IDENTITY_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/identity_security
        run: bash scripts/verify-ci.sh
      - name: Verify packaged dependency coverage
        id: war_dependencies
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/source/target/ai-code-reviewer.war"
          inventory="$GITHUB_WORKSPACE/source/target/dependency-list.txt"
          report_directory="$GITHUB_WORKSPACE/.local"
          report="$report_directory/war-dependencies-ci.json"
          if [[ -L "$report_directory" || ( -e "$report_directory" && ! -d "$report_directory" ) ]]; then
            printf '%s\n' 'Refusing an unsafe dependency report directory.' >&2
            exit 1
          fi
          mkdir -p -- "$report_directory"
          if [[ -L "$report_directory" || ! -d "$report_directory" ]]; then
            printf '%s\n' 'Dependency report directory is unavailable.' >&2
            exit 1
          fi
          if [[ -e "$inventory" || -L "$inventory" || -e "$report" || -L "$report" ]]; then
            printf '%s\n' 'Refusing an existing dependency inventory or coverage report.' >&2
            exit 1
          fi
          publish_report() {
            if [[ -f "$report" && ! -L "$report" ]]; then
              {
                printf '%s\n' '### Packaged dependency coverage' '' '```json'
                cat -- "$report"
                printf '%s\n' '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          trap publish_report EXIT
          # Bind later checks to this job's tested bytes; this is not an independent release approval.
          artifact_digest="$(sha256sum -- "$artifact")"
          artifact_digest="${artifact_digest%% *}"
          (
            cd -- "$GITHUB_WORKSPACE/source"
            ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.9.0:list \
              "-DoutputFile=$inventory"
          )
          # Maven may resolve public dependencies above; the Python coverage gate performs no network requests.
          python3 scripts/check-war-dependencies.py \
            --war-file "$artifact" --expected-war-sha256 "$artifact_digest" \
            --inventory-file "$inventory" --pom-file "$GITHUB_WORKSPACE/source/pom.xml" \
            --approved-file "$GITHUB_WORKSPACE/scripts/public-maven-coordinates.txt" \
            --supplemental-file "$GITHUB_WORKSPACE/scripts/packaged-maven-artifacts.json" \
            --maven-repository "$HOME/.m2/repository" --report-file "$report"
          printf 'war_sha256=%s\n' "$artifact_digest" >> "$GITHUB_OUTPUT"
      - name: Verify Linux deployment artifacts without installing services
        env:
          EXPECTED_WAR_SHA256: ${{ steps.war_dependencies.outputs.war_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          command -v sha256sum >/dev/null
          command -v unzip >/dev/null
          BASH_BIN="$(command -v bash)"
          export BASH_BIN
          bash -n deploy/linux/verify-artifact.sh
          python3 deploy/linux/test-verify-artifact.py
          artifact="${GITHUB_WORKSPACE}/source/target/ai-code-reviewer.war"
          # Use the bytes already checked above; deployment still needs an independently approved digest.
          bash deploy/linux/verify-artifact.sh "$artifact" "$EXPECTED_WAR_SHA256"
      - name: Verify packaged review recovery after a killed process
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/reviewer_integration
        shell: bash
        run: |
          set -euo pipefail
          java_bin="$(command -v java)"
          psql_bin="$(command -v psql)"
          python3 scripts/verify-review-restart.py \
            --war "$GITHUB_WORKSPACE/source/target/ai-code-reviewer.war" \
            --java "$java_bin" --psql "$psql_bin" --port 18089
      - name: Verify two packaged workers and progress behind a slow project
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/reviewer_integration
        shell: bash
        run: |
          set -euo pipefail
          java_bin="$(command -v java)"
          psql_bin="$(command -v psql)"
          python3 scripts/verify-review-concurrency.py \
            --war "$GITHUB_WORKSPACE/source/target/ai-code-reviewer.war" \
            --java "$java_bin" --psql "$psql_bin" --port-a 18090 --port-b 18091
      - name: Verify live database connection loss and recovery
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/reviewer_integration
        shell: bash
        run: |
          set -euo pipefail
          java_bin="$(command -v java)"
          psql_bin="$(command -v psql)"
          python3 scripts/verify-review-network-recovery.py \
            --war "$GITHUB_WORKSPACE/source/target/ai-code-reviewer.war" \
            --java "$java_bin" --psql "$psql_bin" --port 18101 \
            --report "$GITHUB_WORKSPACE/.local/review-network-ci.json"
      - name: Verify committed work after a lost PostgreSQL commit response
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/reviewer_integration
        shell: bash
        run: |
          set -euo pipefail
          java_bin="$(command -v java)"
          psql_bin="$(command -v psql)"
          python3 scripts/verify-review-commit-ack.py \
            --war "$GITHUB_WORKSPACE/source/target/ai-code-reviewer.war" \
            --java "$java_bin" --psql "$psql_bin" --port 18102 \
            --report "$GITHUB_WORKSPACE/.local/review-commit-ack-ci.json"
      - name: Verify repeatable local candidate packaging
        env:
          CANDIDATE_SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_WAR_SHA256: ${{ steps.war_dependencies.outputs.war_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/source/target/ai-code-reviewer.war"
          first="$RUNNER_TEMP/reviewer-candidate-first"
          second="$RUNNER_TEMP/reviewer-candidate-second"
          # This verifies this job's bytes and repeatability; it does not approve or publish a release.
          for output in "$first" "$second"; do
            python3 scripts/package-candidate.py --war "$artifact" \
              --expected-war-sha256 "$EXPECTED_WAR_SHA256" --source-revision "$CANDIDATE_SOURCE_REVISION" \
              --output-dir "$output" --source-date-epoch 0
          done
          candidate="ai-reviewer-0.1.0-SNAPSHOT-candidate.tar.gz"
          cmp -- "$first/$candidate" "$second/$candidate"
          cmp -- "$first/$candidate.sha256" "$second/$candidate.sha256"
