spring.application.name=ai-code-reviewer
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.enabled=false
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/ai_reviewer}
spring.datasource.username=${DB_USERNAME:ai_reviewer}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
# Spring Boot 4.0.8 DataSourceHealthIndicator inherits AbstractHealthIndicator's
# WARN-with-cause logging. Keep its status/503 signal without raw JDBC exception text.
logging.level.org.springframework.boot.jdbc.health.DataSourceHealthIndicator=ERROR

# Empty database requires explicit bootstrap values. Never commit real secrets.
app.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.git-username=${BOOTSTRAP_ADMIN_GIT_USERNAME:}

# Exact repository hosts controlled by the administrator (no URL credentials).
app.git.allowed-hosts=${GIT_ALLOWED_HOSTS:github.com}
app.git.github-api-url=${GITHUB_API_URL:https://api.github.com}
app.git.token=${GIT_TOKEN:}
app.git.token-host=${GIT_TOKEN_HOST:github.com}
app.git.token-origin=${GIT_TOKEN_ORIGIN:}
# Optional credentials for several exact origins; these coexist with the legacy token above.
# Configure deployment secrets externally as app.git.credentials[0].origin / app.git.credentials[0].token.
# Each origin's host must be allow-listed; scheme+host+port must match exactly and duplicate origins are rejected.
app.git.timeout-seconds=${GIT_TIMEOUT_SECONDS:30}
app.git.operation-timeout-seconds=${GIT_OPERATION_TIMEOUT_SECONDS:300}
app.git.max-history-pages=1000
app.git.max-diff-bytes=262144
app.git.max-response-bytes=2097152

# ollama: /api/chat; litellm: compatible chat completions; openai: fixed official Responses endpoint.
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.base-url=${AI_BASE_URL:http://127.0.0.1:11434}
app.ai.model=${AI_MODEL:gemma3:1b}
app.ai.api-key=${AI_API_KEY:}
# Direct OpenAI uses OPENAI_API_KEY separately; never copy it to AI_API_KEY or a committed file.
# An explicit OpenAI model is required; AI_MODEL remains the Ollama/LiteLLM model.
app.ai.openai-model=${OPENAI_MODEL:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:120}
app.ai.max-diff-bytes=262144
app.ai.max-response-bytes=1048576
app.ai.context-tokens=${AI_CONTEXT_TOKENS:32768}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:4096}
app.ai.max-review-calls=${AI_MAX_REVIEW_CALLS:8}

app.operations.stale-after-minutes=${OPERATIONS_STALE_AFTER_MINUTES:120}
app.jdbc.query-timeout-seconds=${JDBC_QUERY_TIMEOUT_SECONDS:30}
app.jdbc.socket-timeout-seconds=${JDBC_SOCKET_TIMEOUT_SECONDS:45}
app.jdbc.connect-timeout-seconds=${JDBC_CONNECT_TIMEOUT_SECONDS:10}

app.review.enabled=${REVIEW_ENABLED:true}
# Four synchronous tasks: queue polling, reconciliation, observations and authentication quota cleanup.
# Leave queue polling a scheduler thread while the other three tasks are running.
spring.task.scheduling.pool.size=4
# Maintenance pause: retain accepted requests without contacting Git or AI.
app.review.worker-enabled=${REVIEW_WORKER_ENABLED:true}
app.review.cron=${REVIEW_CRON:0 0 * * * *}
app.review.max-commits=${REVIEW_MAX_COMMITS:100}
app.review.concurrency=${REVIEW_CONCURRENCY:2}

app.security.login-account-attempts=10
app.security.login-address-attempts=100
app.security.login-window-seconds=900
app.security.login-max-entries=10000
